[package]
name = "trading_ui_style"
version = "0.1.0"
edition = "2024"

[features]
default = ["launcher"]
launcher = ["dep:eframe", "dep:winit", "dep:libc"]

[dependencies]
egui = "0.31"
tracing = "0.1"
app_runtime = { path = "../app_runtime" }
trading_models = { path = "../trading_models" }
reference_client = { path = "../reference_client" }
serde_json = "1"
eframe = { version = "0.31", optional = true, default-features = true }
winit = { version = "0.30", optional = true, default-features = true }
libc = { version = "0.2", optional = true }
