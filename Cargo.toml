[package]
name = "trading_ui_style_rust"
version = "0.1.0"
edition = "2024"

[features]
default = ["launcher"]
launcher = ["dep:eframe", "dep:winit", "dep:libc"]

[dependencies]
egui = "0.31"
tracing = "0.1"
app_runtime_rust = { path = "../app_runtime_rust" }
trading_models_rust = { path = "../trading_models_rust" }
reference_client_rust = { path = "../reference_client_rust" }
serde_json = "1"
eframe = { version = "0.31", optional = true, default-features = true }
winit = { version = "0.30", optional = true, default-features = true }
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5.2", features = ["relax-sign-encoding"] }
objc2-app-kit = { version = "0.2.2", features = [
    "NSApplication",
    "NSRunningApplication",
] }
objc2-foundation = { version = "0.2.2", features = ["NSThread"] }
